name: Release one platform

# Independent release channels: push a tag for ONE platform and only that platform is built and
# published.
#
#   git tag webos-v0.1.0 && git push origin webos-v0.1.0
#   git tag tizen-v0.1.0 && git push origin tizen-v0.1.0
#   git tag vidaa-v0.1.0 && git push origin vidaa-v0.1.0
#
# Or, without tags: Actions > "Release one platform" > Run workflow, pick the platform. The tag
# <platform>-v<package.json version> is then created by the release itself.
#
# The tag's version must equal package.json's version. Releases are never marked "latest", so nothing
# that follows a "latest release" link can pick up a TV package by mistake. The Android / Airtel
# edition is released from G41US/tv-vibehack and is not built or touched here.

on:
  push:
    tags:
      - "tizen-v*"
      - "webos-v*"
      - "vidaa-v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to release"
        required: true
        type: choice
        options: [webos, tizen, vidaa]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Work out platform and version from the tag
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_PLATFORM}-v${PKG_VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          PLATFORM="${TAG%%-v*}"
          VERSION="${TAG#*-v}"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error title=Version mismatch::Tag $TAG says $VERSION but package.json says $PKG_VERSION."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Tests
        run: npm test

      - name: Install the LG webOS CLI
        if: env.PLATFORM == 'webos'
        run: npm install -g @webos-tools/cli

      - name: Build ${{ env.PLATFORM }}
        run: node tools/build.js "$PLATFORM" --package

      - name: Publish (not marked latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          case "$PLATFORM" in
            tizen) FILES=(dist/packages/tvvibe-tizen-*-unsigned.zip);
                   NOTE="Unsigned Tizen payload. Sign it with your own Samsung certificate profile before installing; see platforms/tizen/README.md." ;;
            webos) FILES=(dist/packages/*.ipk);
                   NOTE="Install on an LG TV in Developer Mode with ares-install; see platforms/webos/README.md." ;;
            vidaa) FILES=(dist/packages/tvvibe-vidaa-*.zip);
                   NOTE="Hosted web app for Hisense VIDAA. There is no public VIDAA install route; see platforms/vidaa/README.md." ;;
          esac
          [ ${#FILES[@]} -gt 0 ] || { echo "::error::No package was produced for $PLATFORM"; exit 1; }
          printf '%s\n\nHardware status: see docs/COMPATIBILITY.md. Untested platforms are labelled as such.\n' "$NOTE" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error title=Already released::$TAG exists. Bump the version in package.json for a new release."
            exit 1
          fi
          gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "TV Vibe for $PLATFORM $VERSION" \
            --notes-file notes.md --prerelease --latest=false
